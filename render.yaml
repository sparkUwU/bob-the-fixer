services:
  - type: web
    name: securebank-dashboard
    env: python
    region: singapore
    plan: free
    buildCommand: "cd dashboard && (chmod -R +x node_modules/.bin 2>/dev/null || true) && npm install && npx vite build && pip install -r requirements.txt"
    startCommand: "gunicorn --chdir dashboard server:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: NODE_VERSION
        value: 20.11.0
